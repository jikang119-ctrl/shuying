<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1714">
<title>疏影</title>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/serif-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/base.css">
<style>
  body { min-height: 100svh; display: grid; place-items: center; background: var(--color-night); color: var(--color-night-ink); }
  .lock { width: min(22rem, calc(100% - 2 * var(--gutter))); display: grid; gap: var(--space-xl); justify-items: start; }
  .lock__title { font-size: var(--text-3xl); font-weight: 600; letter-spacing: .12em; line-height: 1; }
  .lock__hint { color: var(--color-night-muted); letter-spacing: .2em; font-size: var(--text-sm); min-height: 1.9em; transition: color var(--dur-short) var(--ease-out); }
  .lock__hint.is-wrong { color: var(--color-night-accent); }
  .lock__form { display: grid; gap: var(--space-lg); width: 100%; }
  .lock__digits { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-sm); }
  .lock__cell { height: 4.25rem; border-bottom: var(--rule-night); display: grid; place-items: center; font-family: var(--font-num); font-size: 2.5rem; font-variant-numeric: lining-nums tabular-nums; transition: border-color var(--dur-short) var(--ease-out); }
  .lock__cell.is-on { border-bottom-color: var(--color-night-accent); }
  .lock__input { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; letter-spacing: 2em; caret-color: transparent; border: 0; background: none; color: transparent; }
  .lock__input:focus-visible { outline: none; }
  .lock__digits:focus-within .lock__cell.is-next { border-bottom-color: var(--color-night-ink); }
  .lock__btn { justify-self: start; min-height: 48px; padding: 0 var(--space-lg); border: var(--rule-night); border-radius: var(--radius-sm); letter-spacing: .3em; white-space: nowrap; transition: border-color var(--dur-short) var(--ease-out), opacity var(--dur-short) var(--ease-out); }
  .lock__btn:hover { border-color: var(--color-night-muted); }
  .lock__btn:active { transform: translateY(1px); }
  .lock__btn:disabled { opacity: .4; cursor: default; }
  .lock__btn[aria-busy="true"] { opacity: .6; }
  .shake { animation: shake 360ms var(--ease-in-out); }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
</style>
</head>
<body>
<main class="lock">
  <h1 class="lock__title">疏影</h1>
  <form class="lock__form" novalidate>
    <label class="lock__digits">
      <span class="sr-only">四位数字</span>
      <span class="lock__cell"></span><span class="lock__cell"></span><span class="lock__cell"></span><span class="lock__cell"></span>
      <input class="lock__input" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" autofocus>
    </label>
    <p class="lock__hint" role="status">我们认识的那天　四个数字</p>
    <button class="lock__btn" type="submit" disabled>打开</button>
  </form>
</main>
<script>
  const form = document.querySelector('.lock__form');
  const input = form.code;
  const cells = [...document.querySelectorAll('.lock__cell')];
  const hint = document.querySelector('.lock__hint');
  const btn = form.querySelector('button');
  const HINT = hint.textContent;

  const paint = () => {
    const v = input.value.replace(/\D/g, '').slice(0, 4);
    input.value = v;
    cells.forEach((c, i) => { c.textContent = v[i] || ''; c.classList.toggle('is-on', !!v[i]); c.classList.toggle('is-next', i === v.length); });
    btn.disabled = v.length < 4;
    if (v.length === 4) form.requestSubmit();
  };
  input.addEventListener('input', () => { hint.textContent = HINT; hint.classList.remove('is-wrong'); paint(); });
  paint();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = input.value;
    if (code.length < 4 || btn.getAttribute('aria-busy') === 'true') return;
    btn.setAttribute('aria-busy', 'true');
    document.cookie = `shuying=${code}; path=/; max-age=31536000; SameSite=Lax`;
    let ok = false;
    try {
      const r = await fetch('gate', { cache: 'no-store' });
      ok = r.status === 204;
      if (r.status === 503 || r.status === 429) hint.textContent = '试太多次了　过一分钟再来';
    } catch { hint.textContent = '网不太好　再试一次'; }
    btn.removeAttribute('aria-busy');
    // 从唱片柜被带过来的，进门后回唱片柜（只认站内的这几个页面）
    const next = new URLSearchParams(location.search).get('next');
    if (ok) { location.replace(next === 'music.html' ? './music.html' : './'); return; }
    document.cookie = 'shuying=; path=/; max-age=0';
    if (hint.textContent === HINT) hint.textContent = '不对哦　再想想';
    hint.classList.add('is-wrong');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    input.value = ''; paint(); input.focus();
  });
</script>
</body>
</html>
